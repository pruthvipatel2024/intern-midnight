<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/53eb4cfca8.js" crossorigin="anonymous"></script>

</head>

<body>

    <h1>Rock-Paper-Scissors</h1>

    <div class="inputs">
        <div class="input" id="rock">
            <img src="images/stone.png" alt="Rock image">
        </div>

        <div class="input" id="paper">
            <img src="images/paper.png" alt="Paper image">
        </div>

        <div class="input" id="scissor">
            <img src="images/scissors.png" alt="Scissor image">
        </div>
    </div>

    <div class="score">
        <div class="uscore">
            <p id="uscore">0</p>
            <p>You</p>
        </div>
        <div class="cscore">
            <p id="cscore">0</p>
            <p>Computer</p>
        </div>
    </div>


    <div class="announce">
        <p id="msg">Choose one of above option to play the game</p>
    </div>
</body>
<script src="script.js"></script>

</html>
